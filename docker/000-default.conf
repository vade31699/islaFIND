# ============================================================
# Apache vhost for the islaFIND container
#
# The document root is public/, and AllowOverride All is what makes
# public/.htaccess work (branded 404, security headers, compression,
# caching). Without it the app still runs, but loses those rules.
# ============================================================
<VirtualHost *:80>
    ServerName localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Apache's mime.types does not always know the PWA manifest.
    AddType application/manifest+json .webmanifest

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
