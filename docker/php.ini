; ============================================================
; php.ini overrides for the Render/Docker deployment
;
; The stock PHP image accepts 2 MB uploads; this app accepts a 5 MB
; profile/listing photo and up to five of them in one album upload,
; so post_max_size must be comfortably above 5 x 5 MB.
; ============================================================

upload_max_filesize = 6M
post_max_size = 32M
max_file_uploads = 10
memory_limit = 256M
max_execution_time = 120
max_input_time = 120

; Render captures stdout/stderr, so PHP errors go to the service log.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
error_log = /proc/self/fd/2

; Do not advertise the PHP version in response headers.
expose_php = Off
